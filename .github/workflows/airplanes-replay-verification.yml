name: Airplanes.live replay verification

on:
  push:
    branches:
      - test/fr24-source-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe historical replay chunks
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error

          base = "https://globe.airplanes.live/globe_history/2026/08/15/heatmap"
          names = ["00.bin.ttf","01.bin.ttf","02.bin.ttf","03.bin.ttf","06.bin.ttf","0c.bin.ttf","12.bin.ttf","17.bin.ttf","23.bin.ttf","ff.bin.ttf","heatmap.bin.ttf"]
          for name in names:
              url=f"{base}/{name}"
              req=urllib.request.Request(url, method="HEAD", headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(f"HEATMAP_HEAD name={name} status={r.status} len={r.headers.get('Content-Length')} type={r.headers.get('Content-Type')} enc={r.headers.get('Content-Encoding')}")
              except urllib.error.HTTPError as e:
                  print(f"HEATMAP_HEAD_FAIL name={name} status={e.code}")
              except Exception as e:
                  print(f"HEATMAP_HEAD_FAIL name={name} err={type(e).__name__}:{e}")
          PY

      - name: Decode one hourly replay chunk and find DLH732
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/replay
          cd /tmp/replay
          curl -fsSL -o 19.bin.ttf https://globe.airplanes.live/globe_history/2026/08/15/heatmap/19.bin.ttf
          curl -fsSL -o replay_analyzer.py https://raw.githubusercontent.com/WeegeeNumbuh1/tar1090-replay-analyzer/main/replay_analyzer.py
          echo "REPLAY_FILE_INFO $(file 19.bin.ttf)"
          echo -n "REPLAY_FIRST_BYTES "; xxd -l 16 -p 19.bin.ttf
          cp 19.bin.ttf 19.bin
          if ! python replay_analyzer.py 19.bin -o decoded.json >/tmp/decoder.log 2>&1; then
            echo "REPLAY_DECODER_FAILED"
            cat /tmp/decoder.log
            exit 1
          fi
          python - <<'PY'
          import json
          data=json.load(open("/tmp/replay/decoded.json","r",encoding="utf-8"))
          matches={}
          for sl in data:
              ts=sl.get("timestamp")
              for ac in sl.get("data",[]):
                  cs=(ac.get("callsign") or "").strip()
                  if cs=="DLH732":
                      h=ac.get("hex")
                      rec=matches.setdefault(h, {"count":0,"first":ts,"last":ts})
                      rec["count"]+=1
                      rec["last"]=ts
          print("REPLAY_DLH732", matches)
          print("REPLAY_SLICES", len(data))
          PY
          ls -lh 19.bin.ttf decoded.json
