name: Airplanes.live replay verification

on:
  push:
    branches:
      - test/fr24-source-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe historical replay chunks
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error

          base = "https://globe.airplanes.live/globe_history/2026/08/15/heatmap"
          names = ["00.bin.ttf","01.bin.ttf","02.bin.ttf","03.bin.ttf","06.bin.ttf","0c.bin.ttf","12.bin.ttf","17.bin.ttf","23.bin.ttf","ff.bin.ttf","heatmap.bin.ttf"]
          for name in names:
              url=f"{base}/{name}"
              req=urllib.request.Request(url, method="HEAD", headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(f"HEATMAP_HEAD name={name} status={r.status} len={r.headers.get('Content-Length')} type={r.headers.get('Content-Type')} enc={r.headers.get('Content-Encoding')}")
              except urllib.error.HTTPError as e:
                  print(f"HEATMAP_HEAD_FAIL name={name} status={e.code}")
              except Exception as e:
                  print(f"HEATMAP_HEAD_FAIL name={name} err={type(e).__name__}:{e}")
          PY

      - name: Decode sequential replay chunks and find DLH732
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/replay
          cd /tmp/replay
          curl -fsSL -o replay_analyzer.py https://raw.githubusercontent.com/WeegeeNumbuh1/tar1090-replay-analyzer/main/replay_analyzer.py
          for h in 37 38 39 40 41; do
            curl -fsSL -o "${h}.bin" "https://globe.airplanes.live/globe_history/2026/08/15/heatmap/${h}.bin.ttf"
          done
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          spec=importlib.util.spec_from_file_location("ra","/tmp/replay/replay_analyzer.py")
          ra=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ra)

          files=[Path(f"/tmp/replay/{h:02d}.bin") for h in range(37,42)]
          state={}
          matches={}
          slices=0
          first_ts=last_ts=None
          sample_dlh=set()
          for path in files:
              for sl in ra.decode_file(path,state):
                  slices += 1
                  ts=sl["timestamp"].isoformat()
                  first_ts=first_ts or ts
                  last_ts=ts
                  for ac in sl["data"]:
                      cs=(ac.get("callsign") or "").strip()
                      if cs.startswith("DLH"):
                          sample_dlh.add(cs)
                      if cs=="DLH732":
                          hx=ac.get("hex")
                          rec=matches.setdefault(hx,{"count":0,"first":ts,"last":ts})
                          rec["count"] += 1
                          rec["last"] = ts
          print("REPLAY_RANGE", first_ts, last_ts, "slices", slices)
          print("REPLAY_DLH732", matches)
          print("REPLAY_DLH_SAMPLE", sorted(sample_dlh)[:80])
          PY
