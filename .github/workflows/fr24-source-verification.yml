name: FR24 source verification

on:
  push:
    branches:
      - test/fr24-source-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Verify anonymous historical lookup and tracks
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/fr24verify
          cd /tmp/fr24verify
          go mod init fr24verify
          go get github.com/igolaizola/fr24@v1.0.0
          go get google.golang.org/protobuf@v1.34.1
          cat > main.go <<'EOF'
          package main

          import (
              "context"
              "encoding/binary"
              "fmt"
              "io"
              "time"

              fr "github.com/igolaizola/fr24/pkg/flightradar"
              pb "github.com/igolaizola/fr24/pkg/proto"
              "google.golang.org/protobuf/proto"
          )

          func msToTime(p *int64) string {
              if p == nil { return "-" }
              return time.Unix(*p/1000, 0).UTC().Format(time.RFC3339)
          }

          func secFromMS(p *int64) int64 {
              if p == nil { return 0 }
              return *p / 1000
          }

          func onDate(p *int64, y int, m time.Month, d int) bool {
              if p == nil { return false }
              t := time.Unix(*p/1000, 0).UTC()
              yy, mm, dd := t.Date()
              return yy == y && mm == m && dd == d
          }

          func parseHistoricTrailFrame(b []byte) (*pb.HistoricTrailResponse, error) {
              if len(b) < 5 { return nil, fmt.Errorf("short grpc-web response: %d bytes", len(b)) }
              if b[0] != 0 { return nil, fmt.Errorf("first grpc-web frame is not data: flag=%d", b[0]) }
              n := int(binary.BigEndian.Uint32(b[1:5]))
              if n <= 0 || len(b) < 5+n {
                  return nil, fmt.Errorf("invalid grpc-web frame length=%d body=%d", n, len(b))
              }
              var out pb.HistoricTrailResponse
              if err := proto.Unmarshal(b[5:5+n], &out); err != nil { return nil, err }
              return &out, nil
          }

          func main() {
              ctx := context.Background()
              c := fr.New()
              _ = c.LoginFromEnvOrConfig()
              fmt.Printf("AUTH_MODE=%s\n", c.AuthMode())

              targetEnd := time.Date(2026, 9, 20, 23, 59, 59, 0, time.UTC).Unix()
              flights := []string{"LH732", "CX255", "UA2151"}

              var selected *fr.FlightListRecord
              for _, number := range flights {
                  ts := targetEnd
                  resp, err := c.FlightList(ctx, fr.FlightListParams{
                      Flight: number, Page: 1, Limit: 25, TimestampS: &ts,
                  })
                  if err != nil {
                      fmt.Printf("FLIGHTLIST_ERROR flight=%s err=%v\n", number, err)
                      continue
                  }
                  body, _ := io.ReadAll(resp.Body)
                  _ = resp.Body.Close()
                  fmt.Printf("FLIGHTLIST_HTTP flight=%s status=%d bytes=%d\n", number, resp.StatusCode, len(body))
                  recs, err := fr.ParseFlightList(body)
                  if err != nil {
                      fmt.Printf("FLIGHTLIST_PARSE_ERROR flight=%s err=%v body_prefix=%q\n", number, err, string(body[:min(len(body), 300)]))
                      continue
                  }
                  fmt.Printf("FLIGHTLIST_RESULT flight=%s count=%d\n", number, len(recs))
                  for i := range recs {
                      r := &recs[i]
                      id := int64(0)
                      if r.FlightID != nil { id = *r.FlightID }
                      fmt.Printf("CANDIDATE flight=%s idx=%d id_dec=%d id_hex=%x route=%v-%v reg=%v type=%v STOD=%s ATOD=%s\n",
                          number, i, id, id, val(r.Origin), val(r.Destination), val(r.Registration), val(r.Typecode), msToTime(r.STOD), msToTime(r.ATOD))
                      if selected == nil && r.FlightID != nil &&
                          (onDate(r.ATOD, 2026, time.September, 20) || onDate(r.STOD, 2026, time.September, 20)) {
                          copy := *r
                          selected = &copy
                      }
                  }
              }

              if selected == nil {
                  fmt.Println("SELECTED_NONE exact_date=2026-09-20")
                  return
              }

              id := *selected.FlightID
              dep := secFromMS(selected.ATOD)
              if dep == 0 { dep = secFromMS(selected.STOD) }
              fmt.Printf("SELECTED id_dec=%d id_hex=%x flight=%v route=%v-%v departure_ts=%d\n",
                  id, id, val(selected.Number), val(selected.Origin), val(selected.Destination), dep)

              // Legacy JSON playback: this should return the full coordinate trail if still usable.
              ts := dep
              presp, err := c.Playback(ctx, fr.PlaybackParams{FlightIDHex: fmt.Sprintf("%x", id), TimestampS: &ts})
              if err != nil {
                  fmt.Printf("JSON_PLAYBACK_ERROR err=%v\n", err)
              } else {
                  body, _ := io.ReadAll(presp.Body)
                  _ = presp.Body.Close()
                  fmt.Printf("JSON_PLAYBACK_HTTP status=%d bytes=%d\n", presp.StatusCode, len(body))
                  pts, perr := fr.ParsePlayback(body)
                  if perr != nil {
                      fmt.Printf("JSON_PLAYBACK_PARSE_ERROR err=%v body_prefix=%q\n", perr, string(body[:min(len(body), 300)]))
                  } else {
                      fmt.Printf("JSON_PLAYBACK_POINTS count=%d\n", len(pts))
                      if len(pts) > 0 {
                          a, z := pts[0], pts[len(pts)-1]
                          fmt.Printf("JSON_PLAYBACK_FIRST ts=%d lat=%.5f lon=%.5f alt=%.0f\n", a.Timestamp, a.Latitude, a.Longitude, a.AltitudeFeet)
                          fmt.Printf("JSON_PLAYBACK_LAST ts=%d lat=%.5f lon=%.5f alt=%.0f\n", z.Timestamp, z.Latitude, z.Longitude, z.AltitudeFeet)
                      }
                  }
              }

              // gRPC HistoricTrail: alternate full-trail path, marked unstable by upstream.
              hresp, err := c.GrpcHistoricTrail(ctx, uint32(id))
              if err != nil {
                  fmt.Printf("GRPC_HISTORIC_ERROR err=%v\n", err)
              } else {
                  body, _ := io.ReadAll(hresp.Body)
                  _ = hresp.Body.Close()
                  fmt.Printf("GRPC_HISTORIC_HTTP status=%d bytes=%d\n", hresp.StatusCode, len(body))
                  hist, herr := parseHistoricTrailFrame(body)
                  if herr != nil {
                      fmt.Printf("GRPC_HISTORIC_PARSE_ERROR err=%v body_prefix=%x\n", herr, body[:min(len(body), 80)])
                  } else {
                      pts := hist.GetRadarRecordsList()
                      fmt.Printf("GRPC_HISTORIC_POINTS count=%d\n", len(pts))
                      if len(pts) > 0 {
                          a, z := pts[0], pts[len(pts)-1]
                          fmt.Printf("GRPC_HISTORIC_FIRST ts=%d lat=%.5f lon=%.5f alt=%d\n", a.GetTimestamp(), a.GetLat(), a.GetLon(), a.GetAltitude())
                          fmt.Printf("GRPC_HISTORIC_LAST ts=%d lat=%.5f lon=%.5f alt=%d\n", z.GetTimestamp(), z.GetLat(), z.GetLon(), z.GetAltitude())
                      }
                  }
              }
          }

          func val(p *string) string {
              if p == nil { return "-" }
              return *p
          }

          func min(a, b int) int {
              if a < b { return a }
              return b
          }
          EOF
          go run .

          echo "=== OLD MULTI-MATCH TEST: UA2151 on 2025-04-22 ==="
          cat > old.go <<'EOF'
          package main

          import (
              "context"
              "fmt"
              "io"
              "net/http"
              "net/url"
              "strconv"
              "time"

              fr "github.com/igolaizola/fr24/pkg/flightradar"
          )

          func main() {
              ctx := context.Background()
              c := fr.New()
              _ = c.LoginFromEnvOrConfig()
              ts := time.Date(2025, 4, 22, 23, 59, 59, 0, time.UTC).Unix()
              resp, err := c.FlightList(ctx, fr.FlightListParams{Flight: "UA2151", Page: 1, Limit: 50, TimestampS: &ts})
              if err != nil {
                  fmt.Printf("OLD_FLIGHTLIST_ERROR err=%v\n", err)
                  return
              }
              body, _ := io.ReadAll(resp.Body)
              _ = resp.Body.Close()
              fmt.Printf("OLD_FLIGHTLIST_HTTP status=%d bytes=%d body_prefix=%q\n", resp.StatusCode, len(body), string(body[:imin(len(body), 400)]))
              recs, err := fr.ParseFlightList(body)
              if err != nil {
                  fmt.Printf("OLD_FLIGHTLIST_PARSE_ERROR err=%v\n", err)
                  return
              }
              fmt.Printf("OLD_FLIGHTLIST_RESULT count=%d\n", len(recs))
              exact := 0
              for i := range recs {
                  r := recs[i]
                  var t *int64
                  if r.ATOD != nil { t = r.ATOD } else { t = r.STOD }
                  if t == nil { continue }
                  dt := time.Unix(*t/1000, 0).UTC()
                  y, m, d := dt.Date()
                  if y != 2025 || m != time.April || d != 22 { continue }
                  exact++
                  id := int64(0)
                  if r.FlightID != nil { id = *r.FlightID }
                  fmt.Printf("OLD_MATCH idx=%d id_dec=%d id_hex=%x route=%s-%s reg=%s STOD=%s ATOD=%s\n",
                      i, id, id, sv(r.Origin), sv(r.Destination), sv(r.Registration), tv(r.STOD), tv(r.ATOD))
                  if r.FlightID == nil { continue }
                  dep := *t / 1000
                  presp, err := c.Playback(ctx, fr.PlaybackParams{FlightIDHex: fmt.Sprintf("%x", id), TimestampS: &dep})
                  if err != nil {
                      fmt.Printf("OLD_PLAYBACK_ERROR id=%x err=%v\n", id, err)
                      continue
                  }
                  pbody, _ := io.ReadAll(presp.Body)
                  _ = presp.Body.Close()
                  pts, perr := fr.ParsePlayback(pbody)
                  if perr != nil {
                      fmt.Printf("OLD_PLAYBACK_PARSE_ERROR id=%x status=%d bytes=%d err=%v\n", id, presp.StatusCode, len(pbody), perr)
                      continue
                  }
                  fmt.Printf("OLD_PLAYBACK_POINTS id=%x status=%d count=%d\n", id, presp.StatusCode, len(pts))
              }
              fmt.Printf("OLD_EXACT_MATCHES count=%d\n", exact)

              // Repeat with the historical-only filter used by the older abc8747 implementation.
              q := url.Values{}
              q.Set("query", "UA2151")
              q.Set("fetchBy", "flight")
              q.Set("page", "1")
              q.Set("limit", "50")
              q.Set("timestamp", strconv.FormatInt(ts, 10))
              q.Set("filterBy", "historic")
              q.Set("device", "web-source-verification")
              req, _ := http.NewRequest("GET", "https://api.flightradar24.com/common/v1/flight/list.json?"+q.Encode(), nil)
              req.Header.Set("User-Agent", "Mozilla/5.0 (X11; Linux x86_64; rv:136.0) Gecko/20100101 Firefox/136.0")
              req.Header.Set("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8")
              req.Header.Set("Origin", "https://www.flightradar24.com")
              req.Header.Set("Referer", "https://www.flightradar24.com/")
              req.Header.Set("fr24-device-id", "web-source-verification")
              fresp, ferr := http.DefaultClient.Do(req)
              if ferr != nil {
                  fmt.Printf("FILTERED_OLD_ERROR err=%v\n", ferr)
                  return
              }
              fbody, _ := io.ReadAll(fresp.Body)
              _ = fresp.Body.Close()
              fmt.Printf("FILTERED_OLD_HTTP status=%d bytes=%d body_prefix=%q\n", fresp.StatusCode, len(fbody), string(fbody[:imin(len(fbody), 400)]))
              frecs, ferr := fr.ParseFlightList(fbody)
              if ferr != nil {
                  fmt.Printf("FILTERED_OLD_PARSE_ERROR err=%v\n", ferr)
                  return
              }
              fexact := 0
              for i := range frecs {
                  r := frecs[i]
                  var t *int64
                  if r.ATOD != nil { t = r.ATOD } else { t = r.STOD }
                  if t == nil { continue }
                  dt := time.Unix(*t/1000, 0).UTC()
                  y, m, d := dt.Date()
                  if y != 2025 || m != time.April || d != 22 { continue }
                  fexact++
                  id := int64(0)
                  if r.FlightID != nil { id = *r.FlightID }
                  fmt.Printf("FILTERED_OLD_MATCH idx=%d id_dec=%d id_hex=%x route=%s-%s reg=%s STOD=%s ATOD=%s\n",
                      i, id, id, sv(r.Origin), sv(r.Destination), sv(r.Registration), tv(r.STOD), tv(r.ATOD))
              }
              fmt.Printf("FILTERED_OLD_EXACT_MATCHES count=%d total=%d\n", fexact, len(frecs))
          }

          func imin(a, b int) int {
              if a < b { return a }
              return b
          }

          func sv(p *string) string {
              if p == nil { return "-" }
              return *p
          }

          func tv(p *int64) string {
              if p == nil { return "-" }
              return time.Unix(*p/1000, 0).UTC().Format(time.RFC3339)
          }
          EOF
          go run old.go

          echo "=== ANONYMOUS HISTORY CUTOFF TEST ==="
          cat > cutoff.go <<'EOF'
          package main

          import (
              "context"
              "fmt"
              "io"
              "time"

              fr "github.com/igolaizola/fr24/pkg/flightradar"
          )

          func main() {
              ctx := context.Background()
              c := fr.New()
              _ = c.LoginFromEnvOrConfig()

              dates := []struct{ y int; m time.Month; d int }{
                  {2026, time.September, 21},
                  {2026, time.September, 20},
                  {2026, time.September, 15},
                  {2026, time.September, 14},
                  {2026, time.September, 13},
                  {2026, time.September, 1},
              }
              for _, x := range dates {
                  ts := time.Date(x.y, x.m, x.d, 23, 59, 59, 0, time.UTC).Unix()
                  resp, err := c.FlightList(ctx, fr.FlightListParams{
                      Flight: "LH732", Page: 1, Limit: 25, TimestampS: &ts,
                  })
                  if err != nil {
                      fmt.Printf("CUTOFF date=%04d-%02d-%02d request_error=%v\n", x.y, x.m, x.d, err)
                      continue
                  }
                  body, _ := io.ReadAll(resp.Body)
                  _ = resp.Body.Close()
                  recs, _ := fr.ParseFlightList(body)
                  prefix := string(body)
                  if len(prefix) > 180 { prefix = prefix[:180] }
                  fmt.Printf("CUTOFF date=%04d-%02d-%02d status=%d records=%d body_prefix=%q\n",
                      x.y, x.m, x.d, resp.StatusCode, len(recs), prefix)
              }

              // Verify the oldest completed flight returned by the successful recent lookup.
              ts := time.Date(2026, time.September, 14, 19, 50, 16, 0, time.UTC).Unix()
              resp, err := c.Playback(ctx, fr.PlaybackParams{FlightIDHex: "41a96bdd", TimestampS: &ts})
              if err != nil {
                  fmt.Printf("CUTOFF_PLAYBACK date=2026-09-14 request_error=%v\n", err)
                  return
              }
              body, _ := io.ReadAll(resp.Body)
              _ = resp.Body.Close()
              pts, perr := fr.ParsePlayback(body)
              fmt.Printf("CUTOFF_PLAYBACK date=2026-09-14 status=%d bytes=%d points=%d parse_error=%v\n",
                  resp.StatusCode, len(body), len(pts), perr)
          }
          EOF
          go run cutoff.go
